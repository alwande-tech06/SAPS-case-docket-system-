<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My cases — Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="chrome"></div>
<main class="wrap">
  <div class="page-head">
    <p class="eyebrow">Detective</p>
    <h1>Cases assigned to me</h1>
    <p class="small muted">You see only the dockets assigned to you. Opening any docket is recorded.</p>
  </div>

  <div class="grid grid-3" id="tiles"></div>

  <div class="folder" data-tab="My caseload" style="margin-top:1.6rem">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Case number</th><th>Type</th><th>Opened</th><th>Last activity</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="caseBody"></tbody>
      </table>
    </div>
  </div>

  <section id="detail" style="margin-top:2rem"></section>
</main>
<footer class="foot">Prototype interface — data is stored in this browser only.</footer>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/detective.js"></script>
</body>
</html>

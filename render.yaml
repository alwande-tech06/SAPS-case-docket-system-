# Render blueprint: in the Render dashboard choose New > Blueprint and pick
# this repository. It creates the web service and its PostgreSQL database.
# Settings marked "sync: false" are asked for when the blueprint is applied.
services:
  - type: web
    name: saps-docket
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true          # a long random value, made once by Render
      - key: DATABASE_URL
        fromDatabase:
          name: saps-docket-db
          property: connectionString
      # Escalate reports undisposed for 24 hours from inside the app.
      - key: SCHEDULER_ENABLED
        value: "true"
      # One-time codes by real SMS: the BulkSMS API token (Token Id / Token
      # Secret). With these set, codes go by SMS automatically.
      - key: BULKSMS_USERNAME
        sync: false
      - key: BULKSMS_PASSWORD
        sync: false
      # One-time codes to each complainant's own email (no SMS cost); the
      # report form then requires an email. Uses the SMTP settings below.
      # Remove (or set "any") to send by SMS when no email is given.
      - key: OTP_CHANNEL
        value: email
      # First deploy only (ignored once accounts exist): either load the demo
      # data with SEED_DEMO_DATA=true, or create the first administrator.
      - key: SEED_DEMO_DATA
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Password-reset email (Gmail: smtp.gmail.com, 587, an app password).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: saps-docket-db
    plan: free
    databaseName: saps_docket
    user: saps_user
    ipAllowList: []                  # reachable only from Render's own network
